name: Daily news scrape

on:
  schedule:
    # 00:00 UTC = 08:00 Hong Kong time
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check email secrets
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          missing=0
          if [ -z "$EMAIL_USER" ]; then echo "Missing secret: EMAIL_USER"; missing=1; fi
          if [ -z "$EMAIL_PASS" ]; then echo "Missing secret: EMAIL_PASS"; missing=1; fi
          if [ -z "$EMAIL_TO" ]; then echo "Missing secret: EMAIL_TO"; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "Add secrets at: Settings → Secrets and variables → Actions"
            echo "EMAIL_PASS must be a Gmail App Password (not your normal password)."
            exit 1
          fi
          echo "Email secrets are present."

      - name: Run scraper and send email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
        run: python Newsheadline.py

      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-headlines
          path: "Daily News Headlines_*.csv"
          if-no-files-found: ignore
          retention-days: 14
